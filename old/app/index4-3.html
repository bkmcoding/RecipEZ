<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipEZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style4-3.css">
</head>

<body>
    <div id="loading">Loading Recipes...</div>
    <div id="search-trigger" onclick="openSearch()">
        Search ingredients (e.g., chicken, garlic)...
    </div>

    <div id="search-overlay" onclick="closeSearchOnBg(event)">
        <div id="search-modal">
            <h2>GO TO RECIPE</h2>
            <input type="text" id="search-input" placeholder="Enter ingredients separated by commas..."
                onkeypress="handleSearchKey(event)">
            <button id="search-submit" onclick="executeSearch()">INITIATE SEARCH</button>
        </div>
    </div>
    <div id="info-panel">
        <button id="close-btn" onclick="closePanel()">✖</button>
        <div id="badge" class="cluster-badge">Cluster</div>
        <h1 id="recipe-name">Recipe Name</h1>
        <h3>Ingredients</h3>
        <ul id="ingredients-list" class="data-list"></ul>
        <h3>Instructions</h3>
        <ol id="steps-list" class="data-list"></ol>
    </div>

    <script src="./script4-3.js"></script>
</body>

</html>
